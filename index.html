<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelio CRM · V2.12</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060b15;--surface:#0b1222;--card:#101828;--card-hi:#141f32;
  --border:#1a2840;--border-hi:#253855;
  --accent:#4272ff;--accent2:#9456ff;
  --accent-soft:rgba(66,114,255,.11);--accent-glow:rgba(66,114,255,.28);
  --grad:linear-gradient(135deg,#4272ff 0%,#9456ff 100%);
  --text:#d8e5ff;--text-sub:#556a90;--text-faint:#1d2e4a;
  --success:#00d18a;--success-soft:rgba(0,209,138,.11);
  --warning:#ffb340;--warning-soft:rgba(255,179,64,.11);
  --danger:#ff4f5e;--danger-soft:rgba(255,79,94,.11);
  --info:#38c3ff;--info-soft:rgba(56,195,255,.11);
  --purple:#9456ff;--purple-soft:rgba(148,86,255,.11);
  --sidebar-w:228px;--rx:14px;--rx-sm:9px;--rx-xs:6px;
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#eef2fa;--surface:#f8faff;--card:#ffffff;--card-hi:#f2f5ff;
  --border:#d9e2f4;--border-hi:#bfcef0;
  --accent:#3360f5;--accent2:#7c3df0;
  --accent-soft:rgba(51,96,245,.09);--accent-glow:rgba(51,96,245,.2);
  --grad:linear-gradient(135deg,#3360f5 0%,#7c3df0 100%);
  --text:#0c1631;--text-sub:#6377a0;--text-faint:#c8d3ea;
  --success:#009960;--success-soft:rgba(0,153,96,.09);
  --warning:#cc8800;--warning-soft:rgba(204,136,0,.09);
  --danger:#d42030;--danger-soft:rgba(212,32,48,.09);
  --info:#0090cc;--info-soft:rgba(0,144,204,.09);
  --purple:#6a2fd4;--purple-soft:rgba(106,47,212,.09);
}
html{scroll-behavior:smooth}
body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}
::selection{background:var(--accent-soft);color:var(--accent)}
.hidden{display:none!important}

/* LAYOUT */
#layout{display:flex;min-height:100vh;max-width:100vw;overflow-x:hidden}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);flex-shrink:0;position:fixed;top:0;left:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:60;transition:background .3s,border-color .3s}
.sb-logo{padding:26px 20px 20px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.sb-icon{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:800;color:#fff}
.sb-name{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--rx-sm);cursor:pointer;transition:all .16s var(--ease);font-size:.875rem;font-weight:500;color:var(--text-sub);border:1px solid transparent;user-select:none}
.ni:hover{background:var(--accent-soft);color:var(--text)}
.ni.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ni svg{width:17px;height:17px;stroke:var(--text-sub);stroke-width:1.8;fill:none;transition:stroke .16s;flex-shrink:0}
.ni:hover svg,.ni.on svg{stroke:var(--accent)}
.ni-lbl{flex:1}
.nc{background:var(--accent-soft);color:var(--accent);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:10px}

/* SAVE STATUS WIDGET */
.save-bar{padding:10px 12px 0}
.save-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--rx-sm);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.save-row:hover{border-color:var(--border-hi)}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
.dok{background:var(--success);box-shadow:0 0 6px var(--success)}
.dwarn{background:var(--warning);box-shadow:0 0 6px var(--warning)}
.doff{background:var(--text-sub)}
.dpulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.save-info{flex:1;min-width:0}
.save-fn{font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.save-fh{font-size:.68rem;color:var(--text-sub);margin-top:1px}

.sb-bot{padding:6px 10px 18px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rx-sm);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .16s;margin-top:8px}
.sb-user:hover{border-color:var(--border-hi);background:var(--card-hi)}
.u-av{width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:#fff;flex-shrink:0}
.u-nm{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-hint{font-size:.71rem;color:var(--text-sub)}

/* MAIN */
#content{margin-left:var(--sidebar-w);flex:1;min-height:100vh;min-width:0;max-width:100%;box-sizing:border-box}
.pg{padding:36px 40px 80px;animation:pgIn .22s var(--ease) both;min-width:0;box-sizing:border-box;width:100%}
@keyframes pgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* PAGE HEADER */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:.71rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-sub);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:18px;height:2px;background:var(--grad);border-radius:1px}
.ptitle{font-family:'Syne',sans-serif;font-size:2rem;font-weight:700;line-height:1.1;letter-spacing:-.025em}
.bcrumb{font-size:.8rem;color:var(--text-sub);margin-top:4px;display:flex;align-items:center;gap:5px}
.bcrumb a{color:var(--accent);cursor:pointer}

/* HOME */
.h-hero{text-align:center;padding:30px 0 38px}
.h-date{font-size:.8rem;letter-spacing:.04em;color:var(--text-sub);margin-bottom:10px}
.h-clock{font-family:'Figtree',sans-serif;font-size:5.5rem;line-height:1;letter-spacing:-.04em;font-weight:300;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;user-select:none}
.h-greet{font-family:'Figtree',sans-serif;font-size:1.15rem;font-weight:400;color:var(--text);margin-top:8px}
.h-greet em{font-style:normal;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:20px 22px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.sc:hover{border-color:var(--border-hi);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.22)}
.sc::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .22s var(--ease)}
.sc:hover::after{transform:scaleX(1)}
.sc-lbl{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-sub);margin-bottom:8px}
.sc-val{font-family:'Figtree',sans-serif;font-size:2.4rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.sc-sub{font-size:.77rem;color:var(--text-sub);margin-top:6px}
.sc-sub strong{color:var(--warning);font-weight:600}
.pb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pb{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;transition:border-color .18s}
.pb:hover{border-color:var(--border-hi)}
.pb-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 12px;border-bottom:1px solid var(--border)}
.pb-title{font-family:'Syne',sans-serif;font-size:.875rem;font-weight:600;display:flex;align-items:center;gap:8px}
.pb-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.ico-b{background:var(--accent-soft)}.ico-g{background:var(--success-soft)}.ico-p{background:var(--purple-soft)}
.pb-body{padding:6px 6px 4px}
.pi{padding:9px 10px;border-radius:var(--rx-sm);cursor:pointer;transition:background .14s}
.pi:hover{background:var(--card-hi)}
.pi-n{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.pi-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.73rem;color:var(--text-sub)}
.pb-foot{padding:10px 12px;border-top:1px solid var(--border)}
.p-empty{padding:20px 12px;text-align:center;color:var(--text-sub);font-size:.8rem;font-style:italic}

/* FILTER TABS */
.frow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.ftabs{display:flex;gap:5px;flex-wrap:wrap}
.ftab{padding:6px 14px;border-radius:20px;font-size:.77rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-sub);font-family:'Figtree',sans-serif;transition:all .14s}
.ftab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.ftab:hover:not(.on){background:var(--card);color:var(--text)}

/* LIST ITEMS */
.ilist{display:flex;flex-direction:column;gap:7px;min-width:0;width:100%}
.ir{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .14s,background .14s,transform .14s;position:relative;overflow:hidden;min-width:0;width:100%;box-sizing:border-box}
.ir::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .14s}
.ir:hover{border-color:var(--border-hi);background:var(--card-hi);transform:translateX(2px)}
.ir:hover::before{opacity:1}
.ir.s-relancer::before,.ir.s-relancer:hover::before{background:var(--warning);opacity:1}
.ir.s-acceptee::before,.ir.s-acceptee:hover::before{background:var(--success);opacity:1}
.ir.s-refusee::before,.ir.s-refusee:hover::before{background:var(--danger);opacity:.7}
.ir.p-prio::before,.ir.p-prio:hover::before{background:var(--warning);opacity:1}
.ir.done{opacity:.55}
.ir.done .ir-n{text-decoration:line-through}
.ir-main{flex:1;min-width:0}
.ir-n{font-size:.9rem;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir-m{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden;font-size:.75rem;color:var(--text-sub)}
.ir-act{display:flex;gap:5px;flex-shrink:0;margin-top:1px}
.chk{display:flex;align-items:flex-start;padding-top:2px;cursor:pointer;font-size:1.2rem;line-height:1;flex-shrink:0;color:var(--text-sub);transition:color .14s}
.chk:hover{color:var(--success)}
.chk.ck{color:var(--success)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;flex-shrink:0;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bw{background:var(--warning-soft);color:var(--warning)}.bw::before{background:var(--warning)}
.bd{background:var(--danger-soft);color:var(--danger)}.bd::before{background:var(--danger)}
.bs{background:var(--success-soft);color:var(--success)}.bs::before{background:var(--success)}
.bi{background:var(--info-soft);color:var(--info)}.bi::before{background:var(--info)}
.bm{background:var(--border);color:var(--text-sub)}.bm::before{background:var(--text-sub)}
.bp{background:var(--purple-soft);color:var(--purple)}.bp::before{background:var(--purple)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:.7rem;color:var(--text-sub);background:var(--border);border:1px solid var(--border-hi);white-space:nowrap;flex-shrink:0}

/* PRIORITY & GROUP */
.cp-forte{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(255,79,94,.25)}
.cp-forte::before{background:var(--danger)!important}
.cp-moyenne{background:var(--warning-soft);color:var(--warning);border:1px solid rgba(255,179,64,.25)}
.cp-moyenne::before{background:var(--warning)!important}
.cp-faible{background:var(--success-soft);color:var(--success);border:1px solid rgba(0,209,138,.25)}
.cp-faible::before{background:var(--success)!important}
.prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:16px}
.pd-forte{background:var(--danger);box-shadow:0 0 7px var(--danger)}
.pd-moyenne{background:var(--warning);box-shadow:0 0 7px var(--warning)}
.pd-faible{background:var(--success)}
.prio-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pp{padding:11px 6px;border-radius:var(--rx-sm);border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .15s;font-size:.78rem;font-weight:700;color:var(--text-sub)}
.pp:hover{border-color:var(--border-hi)}
.pp.pf{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.pp.pm{border-color:var(--warning);background:var(--warning-soft);color:var(--warning)}
.pp.pl{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.group-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-soft);white-space:nowrap;flex-shrink:0}
.boost-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:.67rem;font-weight:700}
.bt-forte{background:var(--danger-soft);color:var(--danger)}
.bt-moyenne{background:var(--warning-soft);color:var(--warning)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--rx-sm);font-family:'Figtree',sans-serif;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:all .17s var(--ease);white-space:nowrap}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-s{background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.btn-s:hover{border-color:var(--accent)}
.btn-g{background:transparent;color:var(--text-sub);border:1px solid var(--border)}
.btn-g:hover{background:var(--card);color:var(--text);border-color:var(--border-hi)}
.btn-d{background:var(--danger-soft);color:var(--danger);border:1px solid transparent}
.btn-d:hover{background:var(--danger);color:#fff}
.btn-sm{padding:7px 15px;font-size:.8rem}
.btn-xs{padding:4px 10px;font-size:.75rem}
.ibt{width:31px;height:31px;border-radius:var(--rx-xs);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-sub);transition:all .14s;font-size:.88rem;font-family:'Figtree',sans-serif}
.ibt:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi)}
.ibt.del:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-soft)}

/* MODAL */
#mo{position:fixed;inset:0;z-index:200;background:rgba(4,8,18,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:mf .18s ease}
@keyframes mf{from{opacity:0}to{opacity:1}}
#mb{background:var(--surface);border:1px solid var(--border-hi);border-radius:20px;width:100%;max-width:580px;max-height:88vh;overflow-y:auto;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.5);animation:ms .22s var(--ease)}
@keyframes ms{from{transform:scale(.96) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.mt{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700}
.mc{width:33px;height:33px;border-radius:50%;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-sub);font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:all .14s}
.mc:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-soft)}

/* FORMS */
.fsec{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:18px;margin-bottom:12px}
.fst{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-sub);margin-bottom:13px;display:flex;align-items:center;gap:7px}
.fst::after{content:'';flex:1;height:1px;background:var(--border)}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.fg:last-child{margin-bottom:0}
.fl{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-sub)}
.fi,.fs,.ft{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 13px;border-radius:var(--rx-sm);font-family:'Figtree',sans-serif;font-size:.9rem;transition:border-color .14s,box-shadow .14s;width:100%;outline:none}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ft{resize:vertical;min-height:86px}
.fs option{background:var(--surface);color:var(--text)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:460px){.f2{grid-template-columns:1fr}}

/* FILE DROP */
.dz{border:2px dashed var(--border);border-radius:var(--rx);padding:22px;text-align:center;color:var(--text-sub);font-size:.84rem;cursor:pointer;transition:all .14s}
.dz:hover,.dz.ov{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fc{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--rx-sm);font-size:.84rem;cursor:pointer}
.fc-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-o{color:var(--accent);font-weight:600;font-size:.77rem;flex-shrink:0}

/* CLIENT SEARCH / FILTER / SORT / MULTISELECT */
.cl-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cl-search-wrap{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:var(--rx-sm);padding:9px 14px;flex:1;min-width:200px;transition:border-color .15s,box-shadow .15s}
.cl-search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cl-search-inp{background:transparent;border:none;color:var(--text);font-family:'Figtree',sans-serif;font-size:.88rem;outline:none;flex:1;min-width:0}
.cl-search-inp::placeholder{color:var(--text-sub)}
.cl-filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cl-filter-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:20px;font-family:'Figtree',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;outline:none;transition:border-color .14s;appearance:none;-webkit-appearance:none}
.cl-filter-select:focus,.cl-filter-select.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cl-sort-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:20px;font-family:'Figtree',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;outline:none}
.cl-filter-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);cursor:pointer}
.cl-filter-tag:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
/* Checkbox on client rows */
.cl-check{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:14px}
/* Bulk action bar */
.bulk-bar{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:var(--rx);padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 8px 32px var(--accent-glow);z-index:50;}
.bulk-count{font-weight:700;font-size:.88rem;color:var(--accent);white-space:nowrap}
.bulk-sep{width:1px;height:20px;background:var(--border)}
/* Select-all row */
.cl-select-row{display:flex;align-items:center;gap:10px;padding:8px 17px;font-size:.8rem;color:var(--text-sub);cursor:pointer;user-select:none}
.cl-select-row:hover{color:var(--text)}
/* Results count */
.cl-results{font-size:.78rem;color:var(--text-sub);padding:2px 0}
/* CLIENT DETAIL */
.cl-hero{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:28px}
.cl-av{width:60px;height:60px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:#fff;flex-shrink:0}
.cl-cn{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.cl-ca{color:var(--text-sub);font-size:.88rem;line-height:1.6}
.sec-h{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-sub);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--border)}
.ct-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:13px 16px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;transition:border-color .14s}
.ct-card:hover{border-color:var(--border-hi)}
.ct-nm{font-weight:600;font-size:.88rem}
.ct-me{font-size:.77rem;color:var(--text-sub);margin-top:3px;line-height:1.7}

/* OPTIONS / AUTO-TASKS */
.oc{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;margin-bottom:12px}
.or{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--border)}
.or:last-child{border-bottom:none}
.or-lbl{font-weight:600;font-size:.9rem}
.or-sub{font-size:.77rem;color:var(--text-sub);margin-top:2px}
.tg-grp{display:flex;border:1px solid var(--border);border-radius:var(--rx-sm);overflow:hidden}
.tog{padding:8px 15px;font-size:.82rem;font-weight:600;cursor:pointer;border:none;font-family:'Figtree',sans-serif;transition:all .14s;background:transparent;color:var(--text-sub)}
.tog.on{background:var(--grad);color:#fff}
.dz-danger{padding:17px 20px;background:var(--danger-soft);border:1px solid var(--danger-soft);border-radius:var(--rx);margin-top:12px}
.dz-t{color:var(--danger);font-weight:700;margin-bottom:9px;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.at-blk{padding:16px 20px;border-bottom:1px solid var(--border)}
.at-blk:last-child{border-bottom:none}
.at-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.at-pip{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.at-lbl{font-size:.88rem;font-weight:700;flex:1}
.at-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--text-sub)}
.at-ni{width:58px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:var(--rx-xs);font-family:'Figtree',sans-serif;font-size:.88rem;text-align:center;outline:none}
.at-ni:focus{border-color:var(--accent)}
.at-sel{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:var(--rx-xs);font-family:'Figtree',sans-serif;font-size:.82rem;outline:none}
.at-tog{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.83rem;font-weight:500}
.at-tog input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* CONTACT ROW IN FORM */
.ctr{background:var(--bg);border:1px solid var(--border);border-radius:var(--rx-sm);padding:13px;margin-bottom:7px}
.ctr-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-sub)}

/* JOURNAL */
.j-layout{display:grid;grid-template-columns:196px 1fr;gap:16px;align-items:start}
.j-left{display:flex;flex-direction:column;gap:10px}
.j-right{display:flex;flex-direction:column;gap:12px}
.cal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-mth{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700}
.cal-arrow{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-sub);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .14s}
.cal-arrow:hover{background:var(--card-hi);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-dow{text-align:center;font-size:.55rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-sub);padding:1px 0 4px}
.cal-d{height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:.68rem;font-weight:500;cursor:pointer;transition:all .13s;position:relative;border:1.5px solid transparent;color:var(--text-sub)}
.cal-d:hover:not(.cal-void){background:var(--card-hi);color:var(--text)}
.cal-d.cal-cur{color:var(--text);font-weight:600}
.cal-d.cal-now{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal-d.cal-sel{background:var(--grad);color:#fff;font-weight:700;border-color:transparent!important}
.cal-d.has-note::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent)}
.cal-d.cal-sel.has-note::after{background:rgba(255,255,255,.7)}
.cal-d.cal-void{cursor:default;opacity:.22}
.cal-today-btn{display:flex;justify-content:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.note-panel{display:flex;flex-direction:column;gap:14px}
.note-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.note-day-label{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.note-status{font-size:.74rem;display:flex;align-items:center;gap:5px;color:var(--text-sub)}
.note-ta{width:100%;min-height:440px;background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:22px;font-family:'Figtree',sans-serif;font-size:.95rem;line-height:1.85;color:var(--text);resize:none;outline:none;transition:border-color .14s,box-shadow .14s;overflow:hidden}
.note-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note-ta::placeholder{color:var(--text-sub);font-style:italic;opacity:.6}
.act-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);overflow:hidden}
.act-card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border)}
.act-card-title{font-family:'Syne',sans-serif;font-size:.875rem;font-weight:600;display:flex;align-items:center;gap:8px}
.act-row{display:flex;align-items:flex-start;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);transition:background .12s;cursor:pointer}
.act-row:last-child{border-bottom:none}
.act-row:hover{background:var(--card-hi)}
.act-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.act-lbl{font-size:.83rem;font-weight:500;margin-bottom:2px}
.act-sub{font-size:.74rem;color:var(--text-sub)}
.act-empty{padding:18px;text-align:center;color:var(--text-sub);font-size:.8rem;font-style:italic}

/* PRODUCTS */
.prod-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prod-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rx-sm);transition:border-color .14s}
.prod-item:hover{border-color:var(--border-hi)}
.prod-name{font-size:.88rem;font-weight:500;flex:1}
.prod-edit-input{background:transparent;border:none;border-bottom:1px solid var(--accent);color:var(--text);font-family:'Figtree',sans-serif;font-size:.88rem;font-weight:500;outline:none;flex:1;padding:2px 4px}
.prod-add-row{display:flex;gap:8px;margin-top:10px}
/* Client product checklist */
.cprod-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--rx-sm);margin-bottom:6px;cursor:pointer;transition:all .13s}
.cprod-item:hover{border-color:var(--border-hi);background:var(--card-hi)}
.cprod-item.has-it{border-color:var(--success);background:var(--success-soft)}
.cprod-check{width:18px;height:18px;accent-color:var(--success);cursor:pointer;flex-shrink:0}
.cprod-name{font-size:.88rem;font-weight:500}
/* Todo product tags */
.prod-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:.71rem;font-weight:600;background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-soft)}
/* Todo product picker */
.prod-pick-list{display:flex;flex-direction:column;gap:5px;margin-top:6px;max-height:180px;overflow-y:auto}
.prod-pick-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--rx-sm);background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:all .13s}
.prod-pick-item:hover{border-color:var(--border-hi)}
.prod-pick-item.sel{border-color:var(--purple);background:var(--purple-soft)}
.prod-pick-item input[type=checkbox]{accent-color:var(--purple);cursor:pointer;width:15px;height:15px}

/* LOGIN SCREEN */
#login-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;justify-content:center}
.login-logo-icon{width:42px;height:42px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:#fff}
.login-logo-name{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:6px;text-align:center}
.login-sub{font-size:.85rem;color:var(--text-sub);text-align:center;margin-bottom:28px}
.login-err{background:var(--danger-soft);border:1px solid var(--danger);border-radius:var(--rx-sm);padding:10px 14px;font-size:.82rem;color:var(--danger);margin-bottom:16px;display:none}
.login-btn{width:100%;padding:13px;border-radius:var(--rx-sm);background:var(--grad);color:#fff;font-family:'Figtree',sans-serif;font-size:.95rem;font-weight:600;border:none;cursor:pointer;transition:all .18s;box-shadow:0 4px 16px var(--accent-glow);margin-top:6px}
.login-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-btn-google{width:100%;padding:13px;border-radius:var(--rx-sm);background:var(--card);color:var(--text);font-family:'Figtree',sans-serif;font-size:.95rem;font-weight:600;border:1px solid var(--border);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.login-btn-google:hover{background:var(--card-hi);border-color:var(--border-hi);transform:translateY(-1px)}
.login-btn-google:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-divider{display:flex;align-items:center;gap:10px;margin:4px 0 16px;color:var(--text-sub);font-size:.78rem}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-no-fb{text-align:center;margin-top:20px;font-size:.8rem;color:var(--text-sub)}
.login-no-fb a{color:var(--accent);cursor:pointer}

/* SYNC STATUS */
.sync-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--rx-sm);font-size:.75rem;font-weight:500;margin-bottom:14px;border:1px solid var(--border)}
.sync-ok{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.sync-warn{background:var(--warning-soft);border-color:var(--warning);color:var(--warning)}
.sync-err{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.sync-idle{background:var(--card);color:var(--text-sub)}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-pulse{animation:pulse 1.4s ease-in-out infinite}
.fb-setup-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:20px;margin-bottom:12px}
.fb-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.fb-step:last-child{margin-bottom:0}
.fb-num{width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.fb-step-text{font-size:.84rem;line-height:1.6;color:var(--text-sub)}
.fb-step-text strong{color:var(--text)}
.fb-step-text a{color:var(--accent)}
.fb-step-text code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:monospace;font-size:.82rem;color:var(--text)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text-sub)}
.empty-i{font-size:2.6rem;margin-bottom:10px;opacity:.45}
.empty-t{font-size:.9rem;margin-bottom:14px}

/* TOAST */
#toast{position:fixed;bottom:26px;left:calc(var(--sidebar-w) + 50%);transform:translateX(-50%);background:var(--grad);color:#fff;padding:10px 22px;border-radius:30px;font-size:.84rem;font-weight:600;z-index:500;box-shadow:0 4px 24px var(--accent-glow);opacity:0;transition:opacity .26s;pointer-events:none}

/* MAP */
#map-container{height:calc(100vh - 200px);min-height:400px;border-radius:var(--rx);border:1px solid var(--border);overflow:hidden;position:relative}
.map-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.map-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--text-sub)}
.map-leg-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;border:1.5px solid rgba(255,255,255,.4)}
.map-geo-bar{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--rx-sm);padding:8px 14px;font-size:.8rem;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
/* Override Leaflet popup style */
.leaflet-popup-content-wrapper{background:var(--surface)!important;border:1px solid var(--border-hi)!important;border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,.4)!important;color:var(--text)!important}
.leaflet-popup-tip{background:var(--surface)!important}
.map-popup-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;margin-bottom:6px}
.map-popup-meta{font-size:.78rem;color:var(--text-sub);line-height:1.8}
.map-popup-btn{display:inline-flex;align-items:center;margin-top:10px;padding:6px 14px;background:var(--grad);color:#fff;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;font-family:'Figtree',sans-serif}

/* CLIENT LOGO */
.logo-upload-area{display:flex;align-items:center;gap:14px;margin-top:4px}
.logo-thumb{width:72px;height:72px;border-radius:var(--rx-sm);object-fit:cover;cursor:pointer;flex-shrink:0;transition:all .15s;border:2px solid var(--border)}
.logo-thumb:hover{border-color:var(--accent);transform:scale(1.04)}
.logo-placeholder{width:72px;height:72px;border-radius:var(--rx-sm);background:var(--card-hi);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.4rem;flex-shrink:0;transition:all .15s}
.logo-placeholder:hover{border-color:var(--accent);background:var(--accent-soft)}
.logo-hint{font-size:.78rem;color:var(--text-sub);line-height:1.6}
/* RICH TEXT NOTE */
.note-toolbar{display:flex;gap:5px;margin-bottom:6px}
.note-tb-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text-sub);font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;font-family:'Figtree',sans-serif}
.note-tb-btn:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi)}
.note-editor{width:100%;min-height:160px;max-height:260px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:14px;font-family:'Figtree',sans-serif;font-size:.92rem;line-height:1.75;color:var(--text);outline:none;transition:border-color .14s,box-shadow .14s}
.note-editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note-editor:empty::before{content:attr(data-placeholder);color:var(--text-sub);font-style:italic;opacity:.6;pointer-events:none}
.note-editor b,.note-editor strong{font-weight:700}
.note-editor u{text-decoration:underline}
/* KANBAN */
.kanban-wrap{display:none}
.todos-kanban-wrap{display:none}
@media(min-width:769px){
  .offers-filter-row{display:none}
  .kanban-wrap{display:block}
  .offers-list-wrap{display:none}
  .todos-filter-row{display:none}
  .todos-list-wrap{display:none}
  .todos-kanban-wrap{display:block}
}

.kanban-wrap{display:none}
@media(min-width:769px){
  .kanban-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;margin-top:4px}
  .offers-list-wrap{display:none}
}
.kb-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;min-height:200px;transition:border-color .15s}
.kb-col.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.kb-col-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.kb-col-title{font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:7px}
.kb-count{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:10px}
.kb-col-body{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:120px}
.kb-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rx-sm);padding:10px 12px;cursor:grab;transition:all .15s;position:relative;user-select:none}
.kb-card:hover{border-color:var(--border-hi);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.kb-card.dragging{opacity:.4;cursor:grabbing}
.kb-card-name{font-size:.84rem;font-weight:600;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-card-meta{font-size:.72rem;color:var(--text-sub);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.kb-card-logo{width:22px;height:22px;border-radius:4px;object-fit:cover;flex-shrink:0}
.kb-drop-hint{text-align:center;padding:20px 10px;color:var(--text-faint);font-size:.78rem;font-style:italic}

/* MOBILE */
@media(max-width:768px){
  :root{--sidebar-w:0px}
  #sidebar{width:100%;height:60px;flex-direction:row;top:auto;bottom:0;left:0;border-right:none;border-top:1px solid var(--border);padding:0}
  .sb-logo,.sb-bot,.save-bar{display:none}
  .sb-nav{flex-direction:row;padding:0;gap:0;justify-content:space-around;align-items:center;flex:1;overflow:hidden}
  .ni{flex-direction:column;gap:2px;padding:7px 8px;font-size:.6rem;border:none;border-radius:var(--rx-sm)}
  .ni svg{width:20px;height:20px}
  .ni-lbl{font-size:.6rem}.nc{display:none}
  #content{margin-left:0}.pg{padding:18px 14px 80px}
  .h-clock{font-size:5.2rem}.stat-grid{grid-template-columns:1fr 1fr}.pb-grid{grid-template-columns:1fr}
  .cl-toolbar{flex-direction:column;align-items:stretch;width:100%}
  .cl-search-wrap{width:100%}
  .cl-filters{flex-wrap:wrap;width:100%}
  .cl-filters select,.cl-filter-select{flex:1;min-width:0;max-width:calc(50% - 4px);font-size:.75rem}
  .cl-bulk-actions{flex-wrap:wrap;gap:5px}
  .cl-bulk-actions .btn{font-size:.75rem;padding:6px 10px}
  .ir-act{flex-shrink:0}
  .ir-m{flex-wrap:wrap;overflow:visible}
  #toast{left:50%;transform:translateX(-50%)}
  .j-layout{grid-template-columns:1fr;height:auto}

// Normalize Firebase data: convert objects back to arrays (Firebase strips empty arrays)
function normalizeFirebaseData(val){
  ['offers','todos','clients','groups','products'].forEach(k=>{
    if(!val[k])                        val[k]=[];
    else if(!Array.isArray(val[k]))    val[k]=Object.values(val[k]);
  });
  if(!val.journal)  val.journal={};
  if(!val.settings) val.settings={};
}

async function fbLoadData(){
  if(!fbDB||!fbUser) return false;
  setSyncStatus('syncing','Chargement...');
  try{
    const snap=await fbDB.ref('data').get();
    const val=snap.val();
    if(!val) return false;
    normalizeFirebaseData(val);
    fbApplyData(val);
    return true;
  }catch(e){
    console.error('fbLoad error',e);
    setSyncStatus('err','Erreur chargement');
    return false;
  }
}

async function fbSaveData(){
  if(!fbDB||!fbUser) return;
  fbWriting=true;
  setSyncStatus('syncing','Sauvegarde...');
  try{
    fbToken=await fbUser.getIdToken();
    await fbDB.ref('data').set(JSON.parse(JSON.stringify(S)));
    const t=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok','Synchronise a '+t);
  }catch(e){ console.error('fbSave error',e); setSyncStatus('err','Erreur sauvegarde'); toast('Erreur synchro Firebase'); }
  setTimeout(()=>{ fbWriting=false; },1200);
}

function fbStartListener(){
  if(!fbDB) return;
  fbStopListener();
  let firstFire=true; // skip the immediate fire (data already loaded by fbLoadData)
  fbListener=fbDB.ref('data').on('value', snap=>{
    if(firstFire){ firstFire=false; return; }
    if(fbWriting) return;
    const val=snap.val();
    if(!val) return;
    normalizeFirebaseData(val); // convert Firebase objects back to arrays
    fbApplyData(val);
    applyTheme(); updNC();
    try{
      const R={home:rHome,offers:()=>rOffers({filter:CF}),todos:()=>rTodos({filter:CF}),
               clients:rClients,journal:()=>rJournal(),options:rOptions};
      if(R[CV]) R[CV]();
    }catch(e){}
    const t=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok','Mis a jour a '+t);
  }, err=>{ console.error('Listener error',err); setSyncStatus('err','Erreur temps reel'); });
}

function fbStopListener(){
  if(fbDB && fbListener){ fbDB.ref('data').off('value',fbListener); fbListener=null; }
}

function fbApplyData(val){
  S=val;
  // Ensure arrays (normalizeFirebaseData should have run, but safety net)
  if(!Array.isArray(S.offers))   S.offers=S.offers?Object.values(S.offers):[];
  if(!Array.isArray(S.todos))    S.todos=S.todos?Object.values(S.todos):[];
  if(!Array.isArray(S.clients))  S.clients=S.clients?Object.values(S.clients):[];
  if(!Array.isArray(S.groups))   S.groups=S.groups?Object.values(S.groups):[];
  if(!Array.isArray(S.products)) S.products=S.products?Object.values(S.products):[];
  if(!S.journal)  S.journal={};
  if(!S.settings) S.settings={};
  if(!S.settings.autoTasks) S.settings.autoTasks={
    forte:{on:true,every:15,unit:'days'},
    moyenne:{on:true,every:45,unit:'days'},
    faible:{on:false,every:90,unit:'days'}
  };
  try{ localStorage.setItem('crm5',JSON.stringify(S)); }catch(e){}
  ovd();
}

// ══ AUTO-TASKS ══
function checkAutoTasks(){
  if(!S.settings.autoTasks)return;
  const at=S.settings.autoTasks;
  let changed=false;
  ['forte','moyenne','faible'].forEach(prio=>{
    const cfg=at[prio];if(!cfg||!cfg.on)return;
    const clients=S.clients.filter(c=>c.priority===prio);
    clients.forEach(c=>{
      const intervalDays=cfg.unit==='months'?cfg.every*30:cfg.every;
      const threshold=new Date();threshold.setDate(threshold.getDate()-intervalDays);
      const threshStr=threshold.toISOString().split('T')[0];
      const pendingAuto=S.todos.find(t=>t.clientId===c.id&&t.autoRelance&&!t.done);
      if(pendingAuto)return;
      const lastAuto=S.todos.filter(t=>t.clientId===c.id&&t.autoRelance&&t.done).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];
      if(lastAuto&&lastAuto.createdAt>threshStr)return;
      const dlEvery=cfg.dlEvery||1;const dlUnit=cfg.dlUnit||'months';
      const dl=new Date();
      if(dlUnit==='months') dl.setMonth(dl.getMonth()+dlEvery);
      else dl.setDate(dl.getDate()+dlEvery);
      const maxDate=dl.toISOString().split('T')[0];
      S.todos.unshift({id:uid(),name:`Recontacter ${c.company}`,description:`Relance automatique — Client priorité ${CPL[prio]}`,createdAt:today(),maxDate,priority:prio==='forte'?'prioritaire':prio==='moyenne'?'normal':'mineure',clientId:c.id,done:false,autoRelance:true});
      changed=true;
    });
  });
  if(changed){save();toast('📋 Tâches de relance créées automatiquement');}
}

// ── Client logo helpers
async function compressImage(file){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=120;
        const ratio=Math.min(MAX/img.width,MAX/img.height,1);
        const canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*ratio);
        canvas.height=Math.round(img.height*ratio);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/jpeg',0.78));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function sdrop(){const dz=document.getElementById('fdz');if(!dz)return;dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('ov')});dz.addEventListener('dragleave',()=>dz.classList.remove('ov'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('ov');if(e.dataTransfer.files[0])pfile(e.dataTransfer.files[0])})}

// ══ KANBAN OFFERS ══
const KB_COLS=[
  {status:'en_attente', label:'En attente', dot:'var(--info)', bg:'var(--info-soft)'},
  {status:'a_relancer', label:'À relancer', dot:'var(--warning)', bg:'var(--warning-soft)'},
  {status:'acceptee',   label:'Acceptées',  dot:'var(--success)', bg:'var(--success-soft)'},
  {status:'refusee',    label:'Refusées',   dot:'var(--danger)',  bg:'var(--danger-soft)'},
];

function kbSortOffers(offers){
  const pOrd={forte:0,moyenne:1,faible:2};
  return [...offers].sort((a,b)=>{
    // Primary: expectedReturnDate asc (nulls last)
    const da=a.expectedReturnDate||'9999-99-99';
    const db=b.expectedReturnDate||'9999-99-99';
    if(da!==db) return da.localeCompare(db);
    // Secondary: client priority
    const ca=cobj(a.clientId);const cb=cobj(b.clientId);
    const pa=ca?.priority?pOrd[ca.priority]??3:3;
    const pb=cb?.priority?pOrd[cb.priority]??3:3;
    return pa-pb;
  });
}

function rKanban(){
  const kw=document.getElementById('kb-wrap');if(!kw)return;
  // Priority filter bar
  const prioBar=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;grid-column:1/-1;flex-wrap:wrap">
    <span style="font-size:.78rem;color:var(--text-sub);font-weight:600">Filtrer par priorité client :</span>
    ${[['','Toutes'],['forte','🔴 FORTE'],['moyenne','🟡 MOYENNE'],['faible','🟢 FAIBLE']].map(([v,l])=>
      `<button class="ftab ${kbFilterPrio===v?'on':''}" onclick="kbSetPrio('${v}')">${l}</button>`
    ).join('')}
  </div>`;
  kw.innerHTML=prioBar+`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">`+KB_COLS.map(col=>{
    let offers=S.offers.filter(o=>o.status===col.status);
    if(kbFilterPrio) offers=offers.filter(o=>cobj(o.clientId)?.priority===kbFilterPrio);
    offers=kbSortOffers(offers);
    return`<div class="kb-col" id="kbc-${col.status}"
      ondragover="kbDragOver(event)"
      ondragenter="kbDragEnter(event,'${col.status}')"
      ondragleave="kbDragLeave(event,'${col.status}')"
      ondrop="kbDrop(event,'${col.status}')">
      <div class="kb-col-head">
        <div class="kb-col-title">
          <div style="width:8px;height:8px;border-radius:50%;background:${col.dot};flex-shrink:0"></div>
          ${col.label}
        </div>
        <span class="kb-count" style="background:${col.bg};color:${col.dot}">${offers.length}</span>
      </div>
      <div class="kb-col-body" id="kbb-${col.status}">
        ${offers.length===0?`<div class="kb-drop-hint">Déposer ici</div>`:offers.map(o=>kbCard(o)).join('')}
      </div>
    </div>`;
  }).join('')+'</div>';
}
function kbSetPrio(p){kbFilterPrio=p;rKanban();}

function kbCard(o){
  const c=cobj(o.clientId);
  const logoHtml=c?.logo?`<img class="kb-card-logo" src="${c.logo}">`:'';
  const prio=c?.priority?`<span style="font-size:.65rem;font-weight:700;color:${{forte:'var(--danger)',moyenne:'var(--warning)',faible:'var(--success)'}[c.priority]}">${CPL[c.priority]}</span>`:'';
  const retour=o.expectedReturnDate?`<span>${frel(o.expectedReturnDate)||fmtDate(o.expectedReturnDate)}</span>`:'';
  return`<div class="kb-card" draggable="true"
    ondragstart="kbDragStart(event,'${o.id}')"
    ondragend="kbDragEnd(event)"
    onclick="od('${o.id}')">
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
      ${logoHtml}
      <div class="kb-card-name" style="flex:1">${esc(o.name)}</div>
      <button class="ibt" style="width:24px;height:24px;font-size:.75rem;flex-shrink:0" onclick="event.stopPropagation();of_form('${o.id}')">✏️</button>
    </div>
    <div class="kb-card-meta">
      ${c?`<span style="display:flex;align-items:center;gap:3px">${logoHtml?'':''} ${esc(c.company)}</span>`:''}
      ${prio}
      ${retour}
    </div>
  </div>`;
}

let kbDragging=null,kbFilterPrio='';
function kbDragStart(e,id){kbDragging=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);}
function kbDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drag-over'));}
function kbDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function kbDragEnter(e,status){document.getElementById('kbc-'+status)?.classList.add('drag-over');}
function kbDragLeave(e,status){
  const col=document.getElementById('kbc-'+status);
  if(col&&!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
}
function kbDrop(e,status){
  e.preventDefault();
  const id=e.dataTransfer.getData('text/plain')||kbDragging;
  const o=S.offers.find(x=>x.id===id);
  if(o&&o.status!==status){
    o.status=status;
    save();
    toast(SL[status]);
  }
  document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drag-over'));
  rKanban();
}

    <button class="ftab ${f==='done'?'on':''}" onclick="stf('done')">Faites <span style="opacity:.6">${done}</span></button>
  </div></div>
  <div class="todos-list-wrap"><div class="ilist">${list.length===0?`<div class="empty"><div class="empty-i">✅</div><div class="empty-t">Aucune tâche ici</div><button class="btn btn-s" onclick="td_form()">+ Créer</button></div>`:list.map(t=>trRow(t)).join('')}</div></div>
  <div class="todos-kanban-wrap" id="td-kb-wrap"></div>`;

// ══ KANBAN TODOS ══
const KB_TODO_COLS=[
  {key:'mineure',  label:'Mineure',     dot:'var(--text-sub)', bg:'var(--border)'},
  {key:'normal',   label:'Normal',      dot:'var(--info)',     bg:'var(--info-soft)'},
  {key:'prioritaire',label:'Prioritaire',dot:'var(--warning)', bg:'var(--warning-soft)'},
  {key:'done',     label:'Terminées',   dot:'var(--success)',  bg:'var(--success-soft)'},
];
let tdKbFilter='', tdKbDragging=null;

function rTodoKanban(){
  const kw=document.getElementById('td-kb-wrap');if(!kw)return;
  const pOrd={forte:0,moyenne:1,faible:2};
  function sortTodos(list){
    return [...list].sort((a,b)=>{
      const ea=effPrio(b)-effPrio(a);if(ea!==0)return ea;
      return(a.maxDate||'9999').localeCompare(b.maxDate||'9999');
    });
  }
  const prioBar=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <span style="font-size:.78rem;color:var(--text-sub);font-weight:600">Filtrer par priorité client :</span>
    ${[['','Toutes'],['forte','🔴 FORTE'],['moyenne','🟡 MOYENNE'],['faible','🟢 FAIBLE']].map(([v,l])=>
      `<button class="ftab ${tdKbFilter===v?'on':''}" onclick="tdKbSetPrio('${v}')">${l}</button>`
    ).join('')}
  </div>`;

  kw.innerHTML=prioBar+`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">`+KB_TODO_COLS.map(col=>{
    let todos;
    if(col.key==='done') todos=S.todos.filter(t=>t.done);
    else todos=S.todos.filter(t=>!t.done&&(t.priority||'normal')===col.key);
    if(tdKbFilter) todos=todos.filter(t=>cobj(t.clientId)?.priority===tdKbFilter);
    todos=sortTodos(todos);
    return`<div class="kb-col" id="tdkbc-${col.key}"
      ondragover="tdKbDragOver(event)"
      ondragenter="tdKbDragEnter(event,'${col.key}')"
      ondragleave="tdKbDragLeave(event,'${col.key}')"
      ondrop="tdKbDrop(event,'${col.key}')">
      <div class="kb-col-head">
        <div class="kb-col-title">
          <div style="width:8px;height:8px;border-radius:50%;background:${col.dot};flex-shrink:0"></div>
          ${col.label}
        </div>
        <span class="kb-count" style="background:${col.bg};color:${col.dot}">${todos.length}</span>
      </div>
      <div class="kb-col-body" id="tdkbb-${col.key}">
        ${todos.length===0?`<div class="kb-drop-hint">Déposer ici</div>`:todos.map(t=>tdKbCard(t)).join('')}
      </div>
    </div>`;
  }).join('')+'</div>';
}

function tdKbCard(t){
  const c=cobj(t.clientId);
  const logoHtml=c?.logo?`<img class="kb-card-logo" src="${c.logo}">`:'';
  const prio=c?.priority?`<span style="font-size:.65rem;font-weight:700;color:${{forte:'var(--danger)',moyenne:'var(--warning)',faible:'var(--success)'}[c.priority]}">${CPL[c.priority]}</span>`:'';
  const due=t.maxDate?`<span style="font-size:.7rem">${frel(t.maxDate)||fmtDate(t.maxDate)}</span>`:'';
  return`<div class="kb-card ${t.done?'done':''}" draggable="true"
    ondragstart="tdKbDragStart(event,'${t.id}')"
    ondragend="tdKbDragEnd(event)"
    onclick="tdDet('${t.id}')">
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
      ${logoHtml}
      <div class="kb-card-name" style="flex:1">${esc(t.name)}${t.autoRelance?` <span style="font-size:.62rem;opacity:.5">auto</span>`:''}</div>
      <button class="ibt" style="width:24px;height:24px;font-size:.75rem;flex-shrink:0" onclick="event.stopPropagation();td_form('${t.id}')">✏️</button>
    </div>
    <div class="kb-card-meta">
      ${c?`<span>${esc(c.company)}</span>`:''}${prio}${due}
    </div>

}

function tdKbSetPrio(p){tdKbFilter=p;rTodoKanban();}
let tdKbDrag=null;
function tdKbDragStart(e,id){tdKbDrag=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);}
function tdKbDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drag-over'));}
function tdKbDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function tdKbDragEnter(e,key){document.getElementById('tdkbc-'+key)?.classList.add('drag-over');}
function tdKbDragLeave(e,key){const col=document.getElementById('tdkbc-'+key);if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-over');}
function tdKbDrop(e,key){
  e.preventDefault();
  const id=e.dataTransfer.getData('text/plain')||tdKbDrag;
  const t=S.todos.find(x=>x.id===id);
  if(t){
    if(key==='done'){ t.done=true; }
    else { t.done=false; t.priority=key; }
    save(); toast(key==='done'?'Tâche terminée ✓':PL[key]);
  }
  document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drag-over'));
  rTodoKanban();
}

// ── Logo upload helpers
function handleLogoFile(e){
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>2*1024*1024){ toast('Image trop lourde (max 2 Mo)'); return; }
  const reader=new FileReader();
  reader.onload=ev=>{
    // Resize to max 120x120 via canvas
    const img=new Image();
    img.onload=()=>{
      const MAX=120;
      let w=img.width, h=img.height;
      if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX}else{w=Math.round(w*MAX/h);h=MAX} }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/png');
      showLogoPreview(dataUrl);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

  const wrap=document.getElementById('logo-preview-wrap');

  if(selClients.size===0) navigate('client-detail',{id});

  if(checked) selClients.add(id); else selClients.delete(id);
  clUpdateBulkBar();

function clToggleAll(checked){
  document.querySelectorAll('.cl-chk').forEach(cb=>{
    cb.checked=checked;
    if(checked) selClients.add(cb.dataset.id); else selClients.delete(cb.dataset.id);
  });

function clUpdateBulkBar(){
  const bar=document.getElementById('cl-bulk-bar');
  const cnt=document.getElementById('cl-sel-count');
  const allChk=document.getElementById('cl-check-all');
  if(!bar) return;
  const n=selClients.size;
  if(n>0){ bar.classList.remove('hidden'); if(cnt) cnt.textContent=n+' sélectionné'+(n>1?'s':''); }
  else { bar.classList.add('hidden'); }
  const totalVisible=document.querySelectorAll('.cl-chk').length;
  if(allChk) allChk.indeterminate=n>0&&n<totalVisible;
  if(allChk) allChk.checked=n===totalVisible&&n>0;
}

function clBulkMail(){
  const ids=[...selClients];
  const emails=[];

function initLeafletMap(){
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  const el=document.getElementById('map-container');
  if(!el) return;

  // Apply dark/light tiles based on theme
  const isDark=document.documentElement.getAttribute('data-theme')!=='light';
  leafletMap=L.map('map-container',{zoomControl:true}).setView([46.8,2.3],6);

  const tileUrl=isDark
    ?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    :'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

  L.tileLayer(tileUrl,{
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains:'abcd',
    maxZoom:19
  }).addTo(leafletMap);

  // Marker cluster group
  const cluster=L.markerClusterGroup({
    maxClusterRadius:50,
    iconCreateFunction: function(c){
      const n=c.getChildCount();
      return L.divIcon({html:`<div style="width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,.3)">${n}</div>`,className:'',iconSize:[36,36]});
    }
  });

  const bounds=[];
  S.clients.forEach(c=>{
    if(!c.lat||!c.lon) return;
    const icon=clientMarkerIcon(c);
    const m=L.marker([c.lat,c.lon],{icon});
    m.bindPopup(clientPopupHtml(c),{maxWidth:240,className:'map-popup'});
    cluster.addLayer(m);
    bounds.push([c.lat,c.lon]);
  });

  leafletMap.addLayer(cluster);
  if(bounds.length>0) leafletMap.fitBounds(bounds,{padding:[40,40],maxZoom:12});
}

// ── Geocoding via Nominatim
async function geoAll(force=false){
  geoQueue=[];
  S.clients.forEach(c=>{
    const skip=!force&&(c.lat!==undefined&&c.lat!==null); // skip if already geocoded (even if failed=0)
    if(c.address&&c.address.trim()&&(force||(!c.lat&&c.lat!==0))) geoQueue.push(c.id);
  });
  if(geoQueue.length===0){ toast('Toutes les positions sont à jour ✓'); return; }
  toast(`Géocodage de ${geoQueue.length} adresse(s)...`);
  if(!geoRunning) geoNext();
}

async function geoNext(){
  if(geoQueue.length===0){
    geoRunning=false;
    save();
    toast('Positions mises à jour ✓');
    if(CV==='map') rMap();
    return;
  }
  geoRunning=true;
  const id=geoQueue.shift();
  const c=S.clients.find(x=>x.id===id);
  if(!c||!c.address){ setTimeout(geoNext,200); return; }
  try{
    const addr=(c.address||'').split('\n').join(' ').trim();
    const q=encodeURIComponent(addr+', France');
    const url='https://nominatim.openstreetmap.org/search?q='+q+'&format=json&limit=1&countrycodes=fr&accept-language=fr';
    const r=await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(data&&data.length>0){
      c.lat=parseFloat(data[0].lat);
      c.lon=parseFloat(data[0].lon);
      // Update bar
      const bar=document.getElementById('geo-status-bar');
      if(bar) bar.textContent=`📍 Géocodage — ${geoQueue.length} adresse(s) restante(s)...`;
    } else {
      c.lat=0; c.lon=0; // address not found — won't retry
    }
  }catch(e){
    console.warn('Geo error for',c.company,e);
    c.lat=null; c.lon=null; // network error — will retry on next geoAll(true)
  }
  // Nominatim: 1 req/sec max
  setTimeout(geoNext, 1100);
}

function buildCal(){
  const yr=calYear,mo=calMonth,t=today();
  const firstDow=new Date(yr,mo,1).getDay();const startOff=firstDow===0?6:firstDow-1;
  const daysInMo=new Date(yr,mo+1,0).getDate();const prevDays=new Date(yr,mo,0).getDate();
  let cells='';
  for(let i=startOff-1;i>=0;i--)cells+=`<div class="cal-d cal-void">${prevDays-i}</div>`;
  for(let d=1;d<=daysInMo;d++){const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const isNow=ds===t,isSel=ds===selDay,hasNote=!!(S.journal[ds]&&S.journal[ds].text);cells+=`<div class="cal-d cal-cur ${isNow?'cal-now':''} ${isSel?'cal-sel':''} ${hasNote?'has-note':''}" onclick="calSelDay('${ds}')">${d}</div>`}
  const total=startOff+daysInMo;const rem=total%7===0?0:7-(total%7);
  for(let i=1;i<=rem;i++)cells+=`<div class="cal-d cal-void">${i}</div>`;
  return`<div class="cal-head"><button class="cal-arrow" onclick="calMove(-1)">‹</button><div class="cal-mth">${MONTH_FR[mo]} ${yr}</div><button class="cal-arrow" onclick="calMove(1)">›</button></div><div class="cal-grid">${DOW_FR.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div><div class="cal-today-btn"><button class="btn btn-g btn-sm" onclick="calSelDay('${t}')">Aujourd'hui</button></div>`;
}
function buildNotePanel(){

  const label=labelLong.charAt(0).toUpperCase()+labelLong.slice(1);
  const isToday=selDay===today(),isFuture=selDay>today();

    <div class="note-status" id="note-st">${updAt?`<span style="color:var(--success)">✓ ${updAt}</span>`:`<span style="opacity:.4">Pas de note</span>`}</div>

function buildActFeed(){
  const d=selDay;const items=[];
  S.offers.filter(o=>o.createdAt===d).forEach(o=>items.push({pip:'var(--accent)',lbl:`Offre créée — ${o.name}`,sub:SL[o.status],fn:`navigate('offers');setTimeout(()=>od('${o.id}'),50)`}));
  S.offers.filter(o=>o.expectedReturnDate===d&&o.createdAt!==d).forEach(o=>items.push({pip:'var(--warning)',lbl:`Retour attendu — ${o.name}`,sub:`Offre · ${SL[o.status]}`,fn:`navigate('offers');setTimeout(()=>od('${o.id}'),50)`}));
  S.todos.filter(t=>t.createdAt===d).forEach(t=>items.push({pip:'var(--success)',lbl:`Tâche créée — ${t.name}`,sub:`${PL[t.priority||'normal']}${t.done?' · Terminée':''}`,fn:`navigate('todos');setTimeout(()=>tdDet('${t.id}'),50)`}));
  S.todos.filter(t=>t.maxDate===d&&t.createdAt!==d).forEach(t=>items.push({pip:t.done?'var(--success)':'var(--danger)',lbl:`Échéance — ${t.name}`,sub:t.done?'Terminée ✓':'En attente',fn:`navigate('todos');setTimeout(()=>tdDet('${t.id}'),50)`}));
  const isToday=d===today(),isPast=d<today();

  return`<div class="act-card"><div class="act-card-head"><div class="act-card-title">📅 ${heading}</div>${items.length?`<span class="tag">${items.length} événement${items.length>1?'s':''}</span>`:''}</div>${items.length===0?`<div class="act-empty">Aucune activité enregistrée</div>`:items.map(it=>`<div class="act-row" onclick="${it.fn}"><div class="act-pip" style="background:${it.pip}"></div><div><div class="act-lbl">${esc(it.lbl)}</div><div class="act-sub">${esc(it.sub)}</div></div></div>`).join('')}</div>`;

function calSelDay(ds){selDay=ds;const[yr,mo]=ds.split('-');calYear=parseInt(yr);calMonth=parseInt(mo)-1;refreshCal();const np=document.getElementById('note-panel')||document.getElementById('j-right-content');if(np)np.innerHTML=buildNotePanel();autoResizeTA()}
function calMove(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}refreshCal()}
function refreshCal(){const cc=document.getElementById('cal-card');if(cc)cc.innerHTML=buildCal()}

function fmtNote(cmd){document.execCommand(cmd,false,null);document.getElementById('note-ta')?.focus();onNoteInput();updateFormatBtns();}
function handleNoteKey(e){if(e.ctrlKey||e.metaKey){if(e.key==='b'){e.preventDefault();fmtNote('bold')}else if(e.key==='u'){e.preventDefault();fmtNote('underline')}else if(e.key==='i'){e.preventDefault();fmtNote('italic')}}}
function updateFormatBtns(){

  <div style="display:flex;flex-direction:column;gap:10px">
    ${primary?`<div class="fsec" style="cursor:pointer" onclick="cm();window.open('https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(primary.email)}','_blank')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="display:flex;align-items:center;gap:14px"><div style="font-size:1.5rem">⭐</div><div><div style="font-weight:700">${esc(primary.name)}</div><div style="font-size:.82rem;color:var(--text-sub)">${esc(primary.email)} · Contact principal</div></div></div>
    </div>`:''}
    <div class="fsec" style="cursor:pointer" onclick="cm();window.open('https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(allEmails)}','_blank')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="display:flex;align-items:center;gap:14px"><div style="font-size:1.5rem">📨</div><div><div style="font-weight:700">Tous les contacts</div><div style="font-size:.82rem;color:var(--text-sub)">${withEmail.length} destinataires · ${withEmail.map(ct=>esc(ct.name)).join(', ')}</div></div></div>
    </div>
  </div>`);
}
// ══ DELETE ══
function del(type,id){
  const lb={offer:'cette offre',todo:'cette tâche',client:'ce client'};
  if(!confirm(`Supprimer ${lb[type]} ?`))return;
  if(type==='offer')S.offers=S.offers.filter(x=>x.id!==id);
  if(type==='todo')S.todos=S.todos.filter(x=>x.id!==id);
  if(type==='client'){S.clients=S.clients.filter(x=>x.id!==id);S.offers.forEach(o=>{if(o.clientId===id)o.clientId=null});S.todos.forEach(t=>{if(t.clientId===id)t.clientId=null})}
  save();updNC();
  if(CV==='offers')rOffers({filter:CF});else if(CV==='todos')rTodos({filter:CF});else if(CV==='clients')rClients();else if(CV==='client-detail')navigate('clients');else if(CV==='home')rHome();
  toast('Supprimé ✓');
}

function doLogout(){
  if(!confirm('Se deconnecter ?'))return;
  fbStopListener();
  if(fbAuth) fbAuth.signOut(); // triggers onAuthStateChanged -> showLogin()
}




// ══ TOAST ══
let tt=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';if(tt)clearTimeout(tt);tt=setTimeout(()=>t.style.opacity='0',2400)}

// ══ LOGIN ══
function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('layout').style.display='none';
  // Pre-fill email if saved
  const em=document.getElementById('login-email');
  if(em&&S.settings.fbEmail)em.value=S.settings.fbEmail;
  // Show skip link if no firebase configured
  const hint=document.getElementById('login-no-fb-hint');
  if(hint)hint.style.display=(!S.settings.fbUrl||!S.settings.fbApiKey)?'block':'none';
}

function hideLogin(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('layout').style.display='';
}

function skipLogin(){
  // No firebase — just enter the app
  hideLogin();
  navigate('home');
  tryReconnectFile();
  setTimeout(checkAutoTasks,800);
}

// doLogin removed — Google only

function showLoginErr(msg){
  const el=document.getElementById('login-err');
  if(el){el.textContent=msg;el.style.display='block';}
}

// ══ INIT ══
load();
applyTheme();
showLogin();
fbInit(); // Firebase handles everything: auth state, data load, listener
</script>
