function saveAT(){
  ['forte','moyenne','faible'].forEach(p=>{
    S.settings.autoTasks[p]={
      on:document.getElementById(`at-on-${p}`)?.checked||false,
      every:parseInt(document.getElementById(`at-ev-${p}`)?.value)||30,
      unit:document.getElementById(`at-un-${p}`)?.value||'days',
      dlEvery:parseInt(document.getElementById(`at-dl-${p}`)?.value)||1,
      dlUnit:document.getElementById(`at-dlu-${p}`)?.value||'months'
    };
  });
  save();toast('Paramètres sauvegardés ✓');
}
function saveFbConfig(){
  // Config is hardcoded — no action needed
  toast('Configuration Firebase integrée dans le fichier');
}
function sname(){S.settings.name=document.getElementById('opt-n').value.trim();save();updNC();toast('Nom enregistré ✓')}
function stheme(t){S.settings.theme=t;save();applyTheme();rOptions()}
function exdata(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`crm-backup-${today()}.json`;a.click()}
function imdata(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.offers||!d.todos||!d.clients)throw new Error('Format invalide');if(!confirm('Remplacer toutes les données ?'))return;S=d;if(!S.journal)S.journal={};if(!S.groups)S.groups=[];if(!S.products)S.products=[];save();applyTheme();updNC();toast('Import réussi ✓');rOptions()}catch(e){alert('Fichier invalide: '+e.message)}};r.readAsText(f)}
function clrall(){if(confirm('Supprimer TOUTES les données ?')){S.offers=[];S.todos=[];S.clients=[];S.groups=[];S.journal={};save();updNC();toast('Données effacées');rOptions()}}
async function reloadFromFile(){if(!fHandle)return;try{const p=await fHandle.queryPermission({mode:'readwrite'});if(p!=='granted'){const r=await fHandle.requestPermission({mode:'readwrite'});if(r!=='granted')return}const f=await fHandle.getFile();const d=JSON.parse(await f.text());if(!d.offers||!d.todos||!d.clients)throw new Error('Format invalide');if(!confirm('Recharger ?'))return;S=d;if(!S.journal)S.journal={};if(!S.groups)S.groups=[];if(!S.products)S.products=[];save();ovd();applyTheme();updNC();navigate(CV);toast('Rechargé ✓')}catch(e){toast('Erreur: '+e.message)}}

function clMailFromDetail(clientId){
  const c=S.clients.find(x=>x.id===clientId);if(!c||!c.contacts)return;
  const withEmail=c.contacts.filter(ct=>ct.email);
  if(withEmail.length===0){toast('Aucun email renseigné dans les contacts');return;}
  if(withEmail.length===1){window.open('https://mail.google.com/mail/?view=cm&to='+encodeURIComponent(withEmail[0].email),'_blank');return;}
  const primary=withEmail.find(ct=>ct.primary);
  const allEmails=withEmail.map(ct=>ct.email).join(',');
  om(`<div class="mh"><h2 class="mt">Envoyer un email</h2><button class="mc" onclick="cm()">✕</button></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    ${primary?`<div class="fsec" style="cursor:pointer" onclick="cm();window.open('https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(primary.email)}','_blank')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="display:flex;align-items:center;gap:14px"><div style="font-size:1.5rem">⭐</div><div><div style="font-weight:700">${esc(primary.name)}</div><div style="font-size:.82rem;color:var(--text-sub)">${esc(primary.email)} · Contact principal</div></div></div>
    </div>`:''}
    <div class="fsec" style="cursor:pointer" onclick="cm();window.open('https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(allEmails)}','_blank')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="display:flex;align-items:center;gap:14px"><div style="font-size:1.5rem">📨</div><div><div style="font-weight:700">Tous les contacts</div><div style="font-size:.82rem;color:var(--text-sub)">${withEmail.length} destinataires · ${withEmail.map(ct=>esc(ct.name)).join(', ')}</div></div></div>
    </div>
  </div>`);
}
// ══ DELETE ══
function del(type,id){
  const lb={offer:'cette offre',todo:'cette tâche',client:'ce client'};
  if(!confirm(`Supprimer ${lb[type]} ?`))return;
  if(type==='offer')S.offers=S.offers.filter(x=>x.id!==id);
  if(type==='invoice')S.invoices=(S.invoices||[]).filter(x=>x.id!==id);
  if(type==='todo')S.todos=S.todos.filter(x=>x.id!==id);
  if(type==='client'){S.clients=S.clients.filter(x=>x.id!==id);S.offers.forEach(o=>{if(o.clientId===id)o.clientId=null});S.todos.forEach(t=>{if(t.clientId===id)t.clientId=null})}
  save();updNC();
  if(CV==='offers')rOffers({filter:CF});else if(CV==='todos')rTodos({filter:CF});else if(CV==='invoices')rInvoices({filter:CF});else if(CV==='clients')rClients();else if(CV==='client-detail')navigate('clients');else if(CV==='home')rHome();
  toast('Supprimé ✓');
}

function doLogout(){
  if(!confirm('Se deconnecter ?'))return;
  fbStopListener();
  if(fbAuth) fbAuth.signOut(); // triggers onAuthStateChanged -> showLogin()
}




// ══ TOAST ══
let tt=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';if(tt)clearTimeout(tt);tt=setTimeout(()=>t.style.opacity='0',2400)}

// ══ LOGIN ══
function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('layout').style.display='none';
  // Pre-fill email if saved
  const em=document.getElementById('login-email');
  if(em&&S.settings.fbEmail)em.value=S.settings.fbEmail;
  // Show skip link if no firebase configured
  const hint=document.getElementById('login-no-fb-hint');
  if(hint)hint.style.display=(!S.settings.fbUrl||!S.settings.fbApiKey)?'block':'none';
}

function hideLogin(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('layout').style.display='';
}

function skipLogin(){
  // No firebase — just enter the app
  hideLogin();
  navigate('home');
  tryReconnectFile();
  setTimeout(checkAutoTasks,800);
}

// doLogin removed — Google only

function showLoginErr(msg){
  const el=document.getElementById('login-err');
  if(el){el.textContent=msg;el.style.display='block';}
}

// ══ INIT ══
load();
applyTheme();
showLogin();
fbInit(); // Firebase handles everything: auth state, data load, listener
